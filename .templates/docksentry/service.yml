  
#---------------------------------------------------------------------#
#     DOCKSENTRY                                                     #
#---------------------------------------------------------------------#  
  
  docksentry:
    image: amayer1983/docksentry:latest
    container_name: docksentry
    ports:
      - "8083:8080"
    env_file:
      - ./services/docksentry/docksentry.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VOLUMES_DIR}/docksentry/docksentry_data:/data
    security_opt:
      - no-new-privileges:true
    labels:
      - homepage.group=OFFICE
      - homepage.name=docksentry
      - homepage.icon=docksentry.png
      - homepage.description=container manager  
    networks:
      private_network:
    restart: unless-stopped
