#---------------------------------------------------------------------#
#     prestoback                                                      #
#---------------------------------------------------------------------#
  prestoback:
    image: piklz/prestoback:latest
    container_name: prestoback
    restart: unless-stopped
    env_file:
      - ./services/prestoback/prestoback.env
    ports:
      - "8778:8778"
    volumes:
      # All app config dirs — prestoback reads/writes these for backup & restore.
      # Must be :rw so restore can overwrite files in place.
      - ${VOLUMES_DIR}:/volumes:rw
      # PrestoBack's own data: config.json, backup archives, history.
      # Bind-mount keeps it inside your existing ~/presto/volumes tree.
      - ${VOLUMES_DIR}/prestoback:/data
      # Docker socket — needed for container stop/start during backup/restore
      # and for the self-update mechanism.
      - /var/run/docker.sock:/var/run/docker.sock      
      # PrestoBack's accses to compose stack
      - /home/pi/presto:/home/pi/presto:ro
    healthcheck:
      # wget is available in the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8778/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - homepage.group=SYSTEM
      - homepage.name=prestoback
      - homepage.icon=prestoback.png
      - homepage.href=http://${SYSTEM_HOSTNAME}.local:8778
      - homepage.description=container backup and restore utility
      - com.presto.app=prestoback
    networks:
      private_network:   

