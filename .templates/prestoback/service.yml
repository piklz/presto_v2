  
#---------------------------------------------------------------------#
#     prestoback                                                      #
#---------------------------------------------------------------------#  
  
  prestoback:
    image: piklz/prestoback:latest 
    container_name: prestoback    
    env_file:
      - ./services/prestoback/prestoback.env  
    ports:
      - "8765:8765"
    volumes:
      # READ-WRITE — restore must write files back into app config dirs
      - ./volumes:/volumes:rw
      # PrestoBack data: config.json + backup archives + history
      - ./volumes/prestoback:/data
      # Docker socket — required for container stop/start and self-update
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH keys for remote push
      - /home/pi/.ssh:/root/.ssh:ro
    labels:
      - homepage.group=NETWORK
      - homepage.name=prestoback
      - homepage.icon=prestoback.png
      - homepage.href=http://${SYSTEM_HOSTNAME:-rpi5-nas}.local:8765
      - homepage.description=container backup and restore utility
      - com.presto.app=prestoback
    restart: unless-stopped
    networks:
      private_network:         

